model:
  # model_path: Qwen/Qwen3-VL-8B-Instruct
  # model_path: ./qwen3_vl_8b_pt_2e-5/checkpoints/global_step_11159_hf
  model_path: ./8b_1e-5_deepfry_80split_fixtool/checkpoints/global_step_7974_hf
  attn_implementation: flash_attention_2

data:
  train_path: configs/multimodal/data/multisource_sft.yaml
  enable_multisource: true
  datasets_type: mapping
  dataloader_type: native # or streaming
  num_workers: 8
  data_type: conversation
  chat_template: qwen_plan_vl
  template_path: templates/qwen-plan-vl-sft.jinja
  max_seq_len: 32768
  train_size: -1
  do_random_crop: true
  crop_ratio: 0.6
  mm_configs:
    source: null  # Will handle "messages" format automatically
    image_bucket: grabcad  # S3 bucket for images

train:
  enable_compile: true

  # enable_profiling: true
  enable_profiling: false
  # profile_start_step: 5
  # profile_end_step: 6

  freeze_vit: true
  # vit_lr: 1.0e-6
  lr: 2e-5
  num_train_epochs: 1
  lr_warmup_ratio: 0.01
  lr_decay_style: cosine
  weight_decay: 0.01
  output_dir: "8b_sft_dfcontinue"
  data_parallel_mode: fsdp2
  enable_reentrant: false
  use_wandb: true
  wandb_project: "gcd-run-42_vl_sft"
  wandb_name: "8b_sft_dfcontinue"
  rmpad: false
  rmpad_with_pos_ids: true
  ulysses_parallel_size: 1
  # num_train_epochs: 1
  micro_batch_size: 1
  global_batch_size: 8
  # max_steps: 1 #30000 # 6B tokens?
  # save_steps: 5000
  init_device: meta
  ckpt_manager: dcp
  save_hf_weights: false
  allow_cuda_launch_blocking: false
  checkpoint_upload_path: s3://camfer-weights/gcd-run-42/8b-vl/8b_sft_dfcontinue # S3 path for auto-upload
  # load_checkpoint_path: ./qwen3_vl_8b_pt_2e-5/checkpoints/global_step_11159
  # memory ops
  enable_mixed_precision: true
  optimizer: "adamw"
  enable_gradient_checkpointing: true  # Reduces memory by trading compute for memory
  # enable_activation_offload: true  # Offload activations to CPU to save GPU memory
  # activation_gpu_limit: 50.0  # GB of activations to keep on GPU (adjust based on available memory)
  empty_cache_steps: 500  # Clear cache more frequently to reduce fragmentation